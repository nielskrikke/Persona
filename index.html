
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/png" href="https://nielskrikke.com/wp-content/uploads/2026/04/persona-app-icon.png" />
    <link rel="shortcut icon" type="image/png" href="https://nielskrikke.com/wp-content/uploads/2026/04/persona-app-icon.png" />
    <link rel="apple-touch-icon" href="https://nielskrikke.com/wp-content/uploads/2026/04/persona-app-icon.png" />
    <title>Persona - D&D Character Sheet & Builder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              dnd: {
                red: 'rgb(var(--color-accent-secondary) / <alpha-value>)',
                gold: 'rgb(var(--color-accent) / <alpha-value>)',
                dark: '#1a1b1e',
                panel: '#25262b',
                text: '#c1c2c5',
              }
            },
            fontFamily: {
              serif: ['Georgia', 'Cambria', 'Times New Roman', 'Times', 'serif'],
              sans: ['system-ui', 'sans-serif'],
            }
          }
        }
      }
    </script>
    <style>
      :root {
        --color-accent: 201 173 106; /* Default Gold: #c9ad6a */
        --color-accent-secondary: 138 11 11; /* Default Red: #8a0b0b */
      }
      body {
        background-color: #1a1b1e;
        color: #c1c2c5;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      /* Mobile: use dynamic viewport height so fixed full-screen layouts
         don't get clipped under iOS Safari browser chrome */
      .h-90dvh { height: 90vh; }
      .max-h-80dvh { max-height: 80vh; }
      @supports (height: 100dvh) {
        .h-screen { height: 100dvh; }
        .h-90dvh { height: 90dvh; }
        .max-h-80dvh { max-height: 80dvh; }
      }
      /* Remove tap-highlight flash and 300ms click delay on touch */
      * {
        -webkit-tap-highlight-color: transparent;
      }
      button, a, input, select, textarea {
        touch-action: manipulation;
      }
      /* Safe-area helpers for notched iPhones / iPad gestures */
      .pt-safe { padding-top: env(safe-area-inset-top); }
      .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
      .pl-safe { padding-left: env(safe-area-inset-left); }
      .pr-safe { padding-right: env(safe-area-inset-right); }
      .px-safe {
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
      }
      /* Fixed bars + their content offsets, aware of safe areas */
      .pt-safe-16 { padding-top: calc(4rem + env(safe-area-inset-top)); }        /* builder content offset (h-16 header) */
      .pt-safe-52 { padding-top: calc(56px + env(safe-area-inset-top)); }        /* sheet content below mobile top bar (h-[56px]) */
      .top-safe-52 { top: calc(56px + env(safe-area-inset-top)); }               /* sheet mobile top bar height */
      .h-minus-safe-52 { height: calc(100% - 56px - env(safe-area-inset-top)); }
      .pb-safe-64 { padding-bottom: calc(4rem + env(safe-area-inset-bottom)); }  /* sheet content above mobile tab bar */
      .bottom-safe-24 { bottom: calc(6rem + env(safe-area-inset-bottom)); }      /* dice tray above mobile tab bar */
      .bottom-safe-100 { bottom: calc(100px + env(safe-area-inset-bottom)); }    /* dice roll bar */
      /* Ensure bottom-anchored fixed UI sits above the home indicator */
      .bottom-safe { bottom: env(safe-area-inset-bottom); }
      /* Prevent iOS rubber-band scrolling from exposing background outside app */
      html, body {
        overscroll-behavior-y: none;
        height: 100%;
      }
      /* Hide scrollbars on horizontally-scrolling chip/tab bars */
      .no-scrollbar {
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      /* Custom scrollbar for better aesthetics */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #1a1b1e; 
      }
      ::-webkit-scrollbar-thumb {
        background: #373a40; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgb(var(--color-accent)); 
      }
      .markdown-body ul {
        list-style-type: disc;
        margin-left: 1.5rem;
        margin-bottom: 1rem;
      }
      .markdown-body li {
        margin-bottom: 0.25rem;
      }
      .markdown-body strong {
        font-weight: 800;
        color: white;
      }
      .markdown-body p {
        margin-bottom: 1rem;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react/": "https://esm.sh/react@18.3.1/",
    "react-dom": "https://esm.sh/react-dom@18.3.1",
    "react-dom/": "https://esm.sh/react-dom@18.3.1/",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@4.2.1",
    "vite": "https://esm.sh/vite@5.2.11",
    "path": "https://esm.sh/path@0.12.7",
    "three": "https://esm.sh/three@0.160.0",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@^2.94.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
